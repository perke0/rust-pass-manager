[package]
name = "SecTool"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.86"
chrono = { version = "0.4.38", features = ["serde"] }
clap = { version = "4.5.54", features = ["derive"] }
dialoguer = "0.12.0"
hex = "0.4.3"
hex-literal = "1.1.0"
rand = "0.8.5"
rpassword = "7.4.0"
secrecy = "0.10.3"
serde = { version = "1.0.203", features = ["derive"] }
serde_json = "1.0.117"
sha2 = "0.10.9"
uuid = { version = "1.8.0", features = ["v4", "serde"] }
